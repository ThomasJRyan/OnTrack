[package]
name = "ontrack"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A small terminal-first project starter"
license = "MIT"

[dependencies]
crossterm = "0.29"
image = { version = "0.25.10", default-features = false, features = ["png"] }
ratcn = { version = "0.0.6", features = ["crossterm"] }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
ratatui-cheese = "0.7.0"
ratatui-splash-screen = { version = "0.1.5", default-features = false, features = ["png"] }
serde_json = "1"
tui-markdown = { version = "=0.3.11", default-features = false }
