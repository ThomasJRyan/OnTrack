name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release_asset.py validate-tag "$RELEASE_TAG"
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check release packaging
        run: python3 -m unittest discover -s scripts -p 'test_release_asset.py'
      - name: Check formatting
        run: cargo +stable fmt --check
      - name: Run tests
        run: cargo +stable test --locked
      - name: Run Clippy
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Check build
        run: cargo +stable build --locked

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add "$TARGET" --toolchain stable
      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo +stable build --locked --release --target "$TARGET"
      - name: Package binary and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: python3 scripts/release_asset.py package "$RELEASE_TAG" "$TARGET" "target/$TARGET/release/ontrack" dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/
          archive: true
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify complete release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release_asset.py verify "$RELEASE_TAG" dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.sha256 --verify-tag --generate-notes --title "$RELEASE_TAG"
